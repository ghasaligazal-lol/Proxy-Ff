syntax = "proto3";
package freefire;

// MajorLoginRes.proto — OB55 COMPLETE + v11 FIX
//
// PENTING: Enum BanReason pakai option allow_alias atau cukup sebagai int32
// supaya protobufjs tidak throw saat verify() (meskipun kita sudah hapus verify()).
// Enum BanReason_IN_GAME_AUTO_NEW = 1014 harus ada supaya decode tidak drop field.

enum BanReason {
  BAN_REASON_UNKNOWN          = 0;
  BAN_REASON_IN_GAME_AUTO     = 1;
  BAN_REASON_REFUND           = 2;
  BAN_REASON_OTHERS           = 3;
  BAN_REASON_SKINMOD          = 4;
  BAN_REASON_IN_GAME_AUTO_NEW = 1014;
}

message BlacklistInfoRes {
  BanReason ban_reason      = 1;
  uint32    expire_duration = 2;
  uint32    ban_time        = 3;
  string    ban_type        = 4;
}

message LoginQueueInfo {
  bool   allow          = 1;
  uint32 queue_position = 2;
  uint32 need_wait_secs = 3;
  bool   queue_is_full  = 4;
}

// FfAntiConfigDesc — OB55 COMPLETE
// Semua field harus ada supaya decode tidak drop dan patch bisa set ke false
message FfAntiConfigDesc {
  string region               = 1;
  bool   enable               = 2;
  string config_url           = 3;
  string version              = 4;
  bool   hpe_enable           = 5;
  bool   ffi_enable           = 6;
  bool   mtp_lite_data_enable = 7;
  bool   ffm_enable           = 8;
  bool   ffo_enable           = 9;
}

// RAFIN — Full MajorLoginRes OB55
message RAFIN {
  uint64              account_id               = 1;
  string              lock_region              = 2;
  string              noti_region              = 3;
  string              ip_region                = 4;
  string              agora_environment        = 5;
  string              new_active_region        = 6;
  repeated string     recommend_regions        = 7;
  string              token                    = 8;
  uint32              ttl                      = 9;
  string              server_url               = 10;
  uint32              emulator_score           = 11;
  BlacklistInfoRes    blacklist                = 12;
  LoginQueueInfo      queue_info               = 13;
  string              tp_url                   = 14;
  uint32              app_server_id            = 15;
  string              ano_url                  = 16;
  string              ip_city                  = 17;
  string              ip_subdivision           = 18;
  uint32              kts                      = 19;
  uint32              ano_port                 = 20;
  int64               timestamp                = 21;
  bytes               ak                       = 22;
  bytes               aiv                      = 23;
  string              ffanti_url               = 24;
  FfAntiConfigDesc    ff_anti_config_desc      = 25;
  string              garena_open_id           = 26;
  uint32              login_count              = 27;
  string              server_region            = 28;
  uint32              account_type             = 29;
  uint32              login_type               = 30;
  string              device_id                = 31;
  uint32              is_banned                = 32;
  string              ban_message              = 33;
  uint32              client_debug_flag        = 34;
  string              sdk_platform             = 35;
  bool                connection_seed_enabled  = 36;
  string              connection_seed          = 37;
  // Field 38+ unknown — protobufjs akan skip (proto3 lenient)
}
