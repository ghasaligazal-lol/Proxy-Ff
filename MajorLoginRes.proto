syntax = "proto3";
package freefire;

// Ban reason enum dari FreeFire_pb2
enum BanReason {
  BAN_REASON_UNKNOWN        = 0;
  BAN_REASON_IN_GAME_AUTO   = 1;
  BAN_REASON_REFUND         = 2;
  BAN_REASON_OTHERS         = 3;
  BAN_REASON_SKINMOD        = 4;
  BAN_REASON_IN_GAME_AUTO_NEW = 1014;
}

// Blacklist/ban info — FIXED: tambah ban_type field 4 (string)
// Sebelumnya tidak ada → proto decode gagal skip unknown field →
// size sub-message tampak lebih kecil dari actual → patchBlacklist limit < 50 skip
message BlacklistInfoRes {
  BanReason ban_reason      = 1;
  uint32    expire_duration = 2;
  uint32    ban_time        = 3;
  string    ban_type        = 4; // FIX: "Modifiers", "Cheat", dll
}

// Login queue info
message LoginQueueInfo {
  bool   allow          = 1;
  uint32 queue_position = 2;
  uint32 need_wait_secs = 3;
  bool   queue_is_full  = 4;
}

// MajorLoginRes — field 22=key (ak), 23=iv (aiv)
message MajorLoginRes {
  uint64 account_uid = 1;
  string region      = 2;
  string token       = 8;
  string url         = 10;
  int64  timestamp   = 21;
  bytes  key         = 22;  // ak — AES key
  bytes  iv          = 23;  // aiv — AES IV
}

// Full login response (RAFIN) — FIXED: tambah kts, ak, aiv, ffanti_url, ff_anti_config_desc
// Field-field ini ada di response nyata (terlihat di BackendLog) tapi tidak ada di proto lama
// → decode partial → kalau ada code yang re-encode, field ini hilang → corrupt
message FfAntiConfigDesc {
  bool   enable      = 1;
  string config_url  = 2;
  string version     = 3;
}

message RAFIN {
  uint64              account_id         = 1;
  string              lock_region        = 2;
  string              noti_region        = 3;
  string              ip_region          = 4;
  string              agora_environment  = 5;
  string              new_active_region  = 6;
  repeated string     recommend_regions  = 7;
  string              token              = 8;
  uint32              ttl                = 9;
  string              server_url         = 10;
  uint32              emulator_score     = 11;
  BlacklistInfoRes    blacklist          = 12;
  LoginQueueInfo      queue_info         = 13;
  string              tp_url             = 14;
  uint32              app_server_id      = 15;
  string              ano_url            = 16;
  string              ip_city            = 17;
  string              ip_subdivision     = 18;
  uint32              kts                = 19; // FIX: key timestamp
  uint32              ano_port           = 20; // extra field
  int64               timestamp          = 21; // FIX: login timestamp
  bytes               ak                 = 22; // FIX: AES key
  bytes               aiv                = 23; // FIX: AES IV
  string              ffanti_url         = 24; // FIX: ffanti URL
  FfAntiConfigDesc    ff_anti_config_desc = 25; // FIX: ffanti config
}
